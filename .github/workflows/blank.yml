name: Build & Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Compile with OpenMP
        run: g++ -O2 -fopenmp -o morphological_dilation Morphological_dilation.cpp

      - name: Run program
        run: ./morphological_dilation
